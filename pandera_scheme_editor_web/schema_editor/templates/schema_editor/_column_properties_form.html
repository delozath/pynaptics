<section class="card">
  <h2>Propiedades de columna</h2>
  <form method="post" action="{{ own_url }}" class="stacked-form">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ own_url }}">

    <label for="{{ form.dtype.id_for_label }}">dtype</label>
    {{ form.dtype }}
    {% for error in form.dtype.errors %}<p class="field-error">{{ error }}</p>{% endfor %}

    <div class="checkbox-row">
      <label>{{ form.nullable }} nullable</label>
      <label>{{ form.required }} required</label>
      <label>{{ form.unique }} unique</label>
      <label>{{ form.coerce }} coerce</label>
      <label>{{ form.regex }} regex</label>
    </div>

    <button type="submit" class="btn btn-primary">Aplicar propiedades</button>
  </form>
</section>
